[project]
name = "autoware-lanelet2-to-clipgt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Masaya Kataoka", email = "ms.kataoka@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "simple-lanelet2>=1.1.2",
    "mgrs>=1.5.0",
    "lxml>=5.2.2",
    "pyarrow>=24.0.0",
    "pandas>=2.3.3",
    "numpy>=2.2.6",
    "matplotlib>=3.10.9",
    "hydra-core>=1.3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"
